<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veritas Market — Autonomous AI Prediction Market on GenLayer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --yes: #10b981;
      --no: #ef4444;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .logo span { color: var(--primary); }
    .badge { background: #1e1b4b; color: #818cf8; border: 1px solid #3730a3; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-yes { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .btn-yes:hover { background: #059669; color: white; }
    .btn-no { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    .btn-no:hover { background: #dc2626; color: white; }
    .btn-resolve { background: #312e81; color: #a5b4fc; border: 1px solid #4f46e5; }
    .btn-resolve:hover { background: #4338ca; color: white; }
    .market-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
    .market-title { font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
    .market-criteria { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; line-height: 1.4; }
    .status-badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 700; }
    .status-active { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid #059669; }
    .status-resolved { background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid #4f46e5; }
    .probability-bar { height: 28px; width: 100%; background: #374151; border-radius: 6px; overflow: hidden; display: flex; margin: 1rem 0; font-size: 0.8rem; font-weight: 700; }
    .prob-yes { background: #059669; display: flex; align-items: center; justify-content: center; transition: width 0.4s ease; color: white; }
    .prob-no { background: #dc2626; display: flex; align-items: center; justify-content: center; transition: width 0.4s ease; color: white; }
    .action-row { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    .ai-rationale { background: #1e1b4b; border-left: 4px solid var(--primary); padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; color: #e0e7ff; margin-top: 1rem; }
    
    /* Wallet Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #1f2937; border: 1px solid #374151; border-radius: 12px; width: 90%; max-width: 380px; padding: 1.5rem; }
    .wallet-choice-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 1rem; margin-top: 0.75rem; background: #111827; border: 1px solid #374151; color: white; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: 0.2s; }
    .wallet-choice-btn:hover { border-color: var(--primary); background: #1e1b4b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="logo">⚡ Veritas <span>Market</span> <span class="badge">GenLayer Bradbury</span></div>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Autonomous Truth & Prediction Protocol</div>
      </div>
      <button class="btn" id="connectWalletBtn">Connect GenLayer Wallet</button>
    </header>

    <main>
      <div id="marketsList"></div>
    </main>
  </div>

  <!-- Wallet Selection Modal -->
  <div class="modal-overlay" id="walletModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
        <h3 style="font-size: 1.1rem;">Select Your Wallet</h3>
        <button onclick="closeWalletModal()" style="background:none; border:none; color:#9ca3af; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <button class="wallet-choice-btn" onclick="selectWallet('rabby')">
        <span>🐰 Rabby Wallet</span>
        <span style="font-size:0.8rem; color:#818cf8;">Direct Connect →</span>
      </button>
      <button class="wallet-choice-btn" onclick="selectWallet('metamask')">
        <span>🦊 MetaMask</span>
        <span style="font-size:0.8rem; color:#818cf8;">Direct Connect →</span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
